<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1a1a2e;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #16213e;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 80%;
            max-width: 300px;
        }
        .slots {
            font-size: 48px;
            letter-spacing: 10px;
            margin: 20px 0;
            background: #0f3460;
            padding: 10px;
            border-radius: 10px;
        }
        button {
            background: #e94560;
            border: none;
            color: white;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        button:active {
            transform: scale(0.98);
        }
        .balance {
            font-size: 20px;
            color: #4ecca3;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🎰 DEMO CASINO</h2>
    <div class="balance">Баланс: <span id="balance">1000</span> 🪙</div>
    <div class="slots" id="slots">🎰 🎰 🎰</div>
    <button onclick="spin()">КРУТИТЬ (50 🪙)</button>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand(); // Раскрыть на весь экран

    let balance = 1000;
    const items = ['🍎', '🍋', '🍒', '7️⃣', '💎'];

    function spin() {
        if (balance < 50) {
            alert("Недостаточно монет!");
            return;
        }
        
        balance -= 50;
        document.getElementById('balance').innerText = balance;

        let slotElem = document.getElementById('slots');
        let spins = 0;
        
        // Простая анимация вращения
        let interval = setInterval(() => {
            let r1 = items[Math.floor(Math.random() * items.length)];
            let r2 = items[Math.floor(Math.random() * items.length)];
            let r3 = items[Math.floor(Math.random() * items.length)];
            slotElem.innerText = `${r1} ${r2} ${r3}`;
            spins++;
            
            if (spins > 10) {
                clearInterval(interval);
                checkWin(r1, r2, r3);
            }
        }, 100);
    }

    function checkWin(a, b, c) {
        if (a === b && b === c) {
            let win = 500;
            balance += win;
            alert(`🎉 ДЖЕКПОТ! Вы выиграли ${win} монет!`);
        } else if (a === b || b === c || a === c) {
            let win = 100;
            balance += win;
            alert(`😊 Малый выигрыш! +${win} монет!`);
        }
        document.getElementById('balance').innerText = balance;
    }
</script>
</body>
</html>
