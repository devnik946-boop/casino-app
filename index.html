<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Текстовая RPG Кликер</title>
    <style>
        :root {
            --common: #b0c3d9;
            --uncommon: #5e98d9;
            --rare: #4b69ff;
            --mythical: #d32ce6;
            --legendary: #eb4b4b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121214;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .game-container {
            width: 100%;
            max-width: 600px;
            background-color: #1a1a1e;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #2a2a30;
        }

        h1, h2 {
            text-align: center;
            margin-top: 0;
            color: #fff;
        }

        .stats-panel {
            background-color: #24242a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            font-size: 1.1em;
            font-weight: bold;
        }

        .gold { color: #ffd700; }
        .damage { color: #ff5555; }

        .btn-main {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            font-weight: bold;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-bottom: 20px;
        }

        .btn-main:hover { background-color: #388e3c; }
        .btn-main:active { transform: scale(0.98); }

        .inventory {
            background-color: #24242a;
            padding: 15px;
            border-radius: 8px;
            max-height: 400px;
            overflow-y: auto;
        }

        .item-card {
            background-color: #1a1a1e;
            border: 2px solid #333;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .item-title {
            font-weight: bold;
            font-size: 1.05em;
        }

        .item-stats {
            font-size: 0.9em;
            color: #aaa;
        }

        /* Цвета редкости */
        .rarity-Обычный { border-color: var(--common); }
        .rarity-Обычный .item-title { color: var(--common); }

        .rarity-Необычный { border-color: var(--uncommon); }
        .rarity-Необычный .item-title { color: var(--uncommon); }

        .rarity-Редкий { border-color: var(--rare); }
        .rarity-Редкий .item-title { color: var(--rare); }

        .rarity-Мифический { border-color: var(--mythical); }
        .rarity-Мифический .item-title { color: var(--mythical); }

        .rarity-Легендарный { border-color: var(--legendary); }
        .rarity-Легендарный .item-title { color: var(--legendary); }

        .item-actions {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            color: #fff;
            transition: opacity 0.2s;
        }

        .btn-action:hover { opacity: 0.8; }
        .btn-upgrade { background-color: #0288d1; }
        .btn-sell { background-color: #d32f2f; }
    </style>
</head>
<body>

<div class="game-container">
    <h1>Текстовая RPG</h1>
    
    <div class="stats-panel">
        <div>Золото: <span id="gold-count" class="gold">0</span> 🪙</div>
        <div>Урон: <span id="damage-count" class="damage">10</span> ⚔️</div>
    </div>

    <button class="btn-main" id="btn-hunt">Отправиться на охоту</button>

    <h2>Инвентарь</h2>
    <div class="inventory" id="inventory-list">
        <!-- Предметы будут создаваться здесь -->
    </div>
</div>

<script>
    // Игровое состояние
    let gameState = {
        gold: 0,
        baseDamage: 10,
        inventory: []
    };

    // Конфигурация редкости и предметов
    const rarities = [
        { name: 'Обычный', chance: 50, color: '#b0c3d9', multiplier: 1 },
        { name: 'Необычный', chance: 30, color: '#5e98d9', multiplier: 1.5 },
        { name: 'Редкий', chance: 13, color: '#4b69ff', multiplier: 2.5 },
        { name: 'Мифический', chance: 5, color: '#d32ce6', multiplier: 4 },
        { name: 'Легендарный', chance: 2, color: '#eb4b4b', multiplier: 7 }
    ];

    const weaponTypes = ['Меч', 'Топор', 'Кинжал', 'Молот', 'Копьё', 'Посох'];

    // Получение суммарного урона (базовый + от предметов)
    function getTotalDamage() {
        return gameState.baseDamage + gameState.inventory.reduce((sum, item) => sum + item.damage, 0);
    }

    // Случайная генерация предмета
    function generateItem() {
        // Определение редкости по шансам
        const rand = Math.random() * 100;
        let cumulative = 0;
        let selectedRarity = rarities[0];

        for (let rarity of rarities) {
            cumulative += rarity.chance;
            if (rand <= cumulative) {
                selectedRarity = rarity;
                break;
            }
        }

        const type = weaponTypes[Math.floor(Math.random() * weaponTypes.length)];
        const baseItemDamage = Math.floor(Math.random() * 5) + 5;
        const damage = Math.round(baseItemDamage * selectedRarity.multiplier);
        const price = Math.round(damage * 3);

        return {
            id: Date.now() + Math.random(),
            name: `${selectedRarity.name} ${type}`,
            rarity: selectedRarity.name,
            damage: damage,
            level: 1,
            price: price,
            upgradePrice: Math.round(price * 0.8)
        };
    }

    // Функция кнопки "Охота"
    document.getElementById('btn-hunt').addEventListener('click', () => {
        // Заработок золота зависит от суммарного урона
        const currentDamage = getTotalDamage();
        const earnedGold = Math.floor(currentDamage * (0.8 + Math.random() * 0.4));
        gameState.gold += earnedGold;

        // 40% шанс найти предмет при охоте
        if (Math.random() < 0.4) {
            const newItem = generateItem();
            gameState.inventory.push(newItem);
        }

        updateUI();
    });

    // Функция улучшения предмета
    function upgradeItem(id) {
        const item = gameState.inventory.find(i => i.id === id);
        if (!item) return;

        if (gameState.gold >= item.upgradePrice) {
            gameState.gold -= item.upgradePrice;
            item.level += 1;
            
            // Увеличение характеристик при апгрейде
            const bonusDamage = Math.max(2, Math.floor(item.damage * 0.25));
            item.damage += bonusDamage;
            item.price += Math.round(item.upgradePrice * 0.6);
            item.upgradePrice = Math.round(item.upgradePrice * 1.5);

            updateUI();
        } else {
            alert('Недостаточно золота для улучшения!');
        }
    }

    // Функция продажи предмета
    function sellItem(id) {
        const itemIndex = gameState.inventory.findIndex(i => i.id === id);
        if (itemIndex !== -1) {
            gameState.gold += gameState.inventory[itemIndex].price;
            gameState.inventory.splice(itemIndex, 1);
            updateUI();
        }
    }

    // Обновление интерфейса
    function updateUI() {
        document.getElementById('gold-count').innerText = gameState.gold;
        document.getElementById('damage-count').innerText = getTotalDamage();

        const inventoryList = document.getElementById('inventory-list');
        inventoryList.innerHTML = '';

        if (gameState.inventory.length === 0) {
            inventoryList.innerHTML = '<div style="text-align: center; color: #777;">Инвентарь пуст. Отправляйтесь на охоту!</div>';
            return;
        }

        gameState.inventory.forEach(item => {
            const card = document.createElement('div');
            card.className = `item-card rarity-${item.rarity}`;
            card.innerHTML = `
                <div class="item-info">
                    <div class="item-title">${item.name} ${item.level > 1 ? `[+${item.level - 1}]` : ''}</div>
                    <div class="item-stats">Урон: +${item.damage}</div>
                </div>
                <div class="item-actions">
                    <button class="btn-action btn-upgrade" onclick="upgradeItem(${item.id})">
                        Улучшить (${item.upgradePrice} 🪙)
                    </button>
                    <button class="btn-action btn-sell" onclick="sellItem(${item.id})">
                        Продать (${item.price} 🪙)
                    </button>
                </div>
            `;
            inventoryList.appendChild(card);
        });
    }

    // Инициализация при старте
    updateUI();
</script>

</body>
</html>
