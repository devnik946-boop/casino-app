<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Общага Батл - Казино & Апгрейд</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body {
            background: #0b0c10;
            background-image: radial-gradient(circle at 50% 0%, #1f2833 0%, #0b0c10 75%);
            color: #FFFFFF;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Навигация / Табы */
        .nav-tabs {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 12px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: rgba(31, 40, 51, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #aaa;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            font-size: 13px;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #ffb800, #ff4500);
            color: #000;
            border: none;
            box-shadow: 0 0 15px rgba(255, 184, 0, 0.3);
        }

        /* Шапка */
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(31, 40, 51, 0.6);
            backdrop-filter: blur(10px);
            padding: 10px 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 12px;
        }
        .logo {
            font-weight: 900;
            font-size: 15px;
            background: linear-gradient(45deg, #ffb800, #ff4500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }
        .balance-box {
            background: rgba(11, 12, 16, 0.7);
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 700;
            color: #66fcf1;
            border: 1px solid rgba(102, 252, 241, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }
        .dep-btn {
            background: #27ae60; color: #fff; border: none;
            padding: 3px 8px; border-radius: 8px; font-weight: 800;
            cursor: pointer; font-size: 10px;
        }

        /* Инвентарь */
        .inventory-section {
            background: rgba(31, 40, 51, 0.5); border-radius: 14px; padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05); margin-bottom: 12px; width: 100%;
        }
        .inventory-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; font-size: 11px; color: #c5c6c7;
        }
        .inventory-list { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; min-height: 80px; }
        
        .inv-card {
            min-width: 90px; height: 75px; background: rgba(11, 12, 16, 0.8); border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1); display: flex; flex-direction: column;
            align-items: center; justify-content: space-between; padding: 6px; cursor: pointer;
        }
        .inv-card.selected { border-color: #ffb800; box-shadow: 0 0 10px rgba(255, 184, 0, 0.5); }
        .inv-card-name { font-size: 10px; font-weight: bold; text-align: center; }
        .inv-card-val { font-size: 10px; color: #ffb800; font-weight: bold; }

        /* Разделы Экранов */
        .view-page { display: none; width: 100%; }
        .view-page.active { display: block; }

        /* РУЛЕТКА (КАЗИНО) */
        .battle-area {
            background: rgba(31, 40, 51, 0.7); border-radius: 16px; border: 1px solid #ffb800;
            padding: 14px; text-align: center; width: 100%;
        }
        .roulette-container {
            overflow: hidden; width: 100%; height: 80px; background: #050608;
            border-radius: 12px; position: relative; margin: 12px 0; border: 1px solid rgba(255,255,255,0.1);
        }
        .pointer {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 3px; height: 100%; background: #ff4500; z-index: 10;
            box-shadow: 0 0 10px #ff4500;
        }
        .roulette-track { display: flex; position: absolute; left: 0; top: 10px; will-change: transform; }

        .drop-item {
            width: 90px; min-width: 90px; height: 60px; margin: 0 4px; border-radius: 8px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 4px; gap: 2px; text-align: center;
        }
        .drop-item-title { font-size: 10px; color: #fff; font-weight: 800; }
        .drop-item-val { font-size: 9px; color: #ffb800; font-weight: bold; }

        /* Цвета редкости */
        .rarity-common { background: rgba(127, 140, 141, 0.2); border: 1px solid #7f8c8d; }
        .rarity-common .drop-item-title, .rarity-common .inv-card-name { color: #bdc3c7; }

        .rarity-rare { background: rgba(52, 152, 219, 0.2); border: 1px solid #3498db; }
        .rarity-rare .drop-item-title, .rarity-rare .inv-card-name { color: #54a0ff; }

        .rarity-epic { background: rgba(155, 89, 182, 0.2); border: 1px solid #9b59b6; }
        .rarity-epic .drop-item-title, .rarity-epic .inv-card-name { color: #be2edd; }

        .rarity-legendary { background: rgba(241, 196, 15, 0.2); border: 1px solid #f1c40f; }
        .rarity-legendary .drop-item-title, .rarity-legendary .inv-card-name { color: #f1c40f; }

        .rooms-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 8px; width: 100%; max-height: 180px; overflow-y: auto; margin-bottom: 10px;
        }
        .room-card {
            background: rgba(31, 40, 51, 0.8); border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px; padding: 8px 4px; text-align: center; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 60px;
        }
        .room-card.selected { border-color: #ffb800; background: rgba(255, 184, 0, 0.1); }

        /* ОКНО АПГРЕЙДА (CASE-BATTLE STYLED) */
        .upgrade-container {
            background: rgba(31, 40, 51, 0.8); border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);
            padding: 16px; display: flex; flex-direction: column; align-items: center; width: 100%;
        }
        
        .upgrade-slots {
            display: flex; justify-content: space-between; width: 100%; gap: 10px; margin-bottom: 15px;
        }
        .upg-slot {
            flex: 1; height: 80px; background: rgba(11, 12, 16, 0.8); border: 2px dashed rgba(255,255,255,0.15);
            border-radius: 12px; display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 6px; text-align: center;
        }
        .upg-slot.filled { border-style: solid; }

        /* Колесо Case-Battle */
        .circle-wrapper {
            position: relative; width: 160px; height: 160px; margin: 10px 0;
        }
        .circle-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .circle-bg { fill: none; stroke: #1b1e28; stroke-width: 12; }
        .circle-sector {
            fill: none; stroke: #ffb800; stroke-width: 12;
            stroke-dasharray: 0 440; transition: stroke-dasharray 0.3s ease;
        }
        .circle-arrow {
            position: absolute; top: 0; left: 50%; width: 4px; height: 80px;
            transform-origin: bottom center; transform: translateX(-50%) rotate(0deg);
            z-index: 5;
        }
        .circle-arrow::before {
            content: ''; position: absolute; top: -4px; left: -4px;
            width: 12px; height: 12px; background: #ff4500; border-radius: 50%;
            box-shadow: 0 0 8px #ff4500;
        }
        .chance-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 20px; font-weight: 900; color: #fff; text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        .target-items-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 6px; width: 100%; max-height: 120px; overflow-y: auto; margin-top: 10px;
        }

        .action-btn {
            background: linear-gradient(135deg, #ffb800, #ff4500);
            border: none; color: #000; width: 100%; padding: 12px;
            border-radius: 12px; font-weight: 900; font-size: 14px; cursor: pointer;
        }
        .action-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">🏢 ОБЩАГА БАТЛ</div>
        <div class="balance-box">
            <span id="balance">1000</span> 🪙
            <button class="dep-btn" onclick="deposit()">+500</button>
        </div>
    </div>

    <!-- Табы переключения -->
    <div class="nav-tabs">
        <div class="tab-btn active" id="tabRoulette" onclick="switchTab('roulette')">🎰 РУЛЕТКА</div>
        <div class="tab-btn" id="tabUpgrade" onclick="switchTab('upgrade')">⚡ АПГРЕЙД</div>
    </div>

    <!-- Общий Инвентарь -->
    <div class="inventory-section">
        <div class="inventory-header">
            <span>📦 Твой инвентарь:</span>
            <span id="invCount" style="font-weight:bold;">0 шт.</span>
        </div>
        <div class="inventory-list" id="inventoryList">
            <div style="font-size:11px; color:#5A5D73; padding:15px; text-align:center; width:100%;">Инвентарь пуст.</div>
        </div>
    </div>

    <!-- ВКЛАДКА 1: РУЛЕТКА -->
    <div id="pageRoulette" class="view-page active">
        <div class="rooms-grid" id="roomsGrid"></div>
        <div class="battle-area" id="battleArea" style="display:none;">
            <h3 id="selectedRoomTitle" style="font-size:13px; color:#ffb800;">Комната №1</h3>
            <div class="roulette-container" id="rouletteContainer">
                <div class="pointer"></div>
                <div class="roulette-track" id="track"></div>
            </div>
            <button class="action-btn" id="spinBtn" onclick="startBattle()">ОТКРЫТЬ КОМНАТУ</button>
        </div>
    </div>

    <!-- ВКЛАДКА 2: АПГРЕЙД (CASE-BATTLE) -->
    <div id="pageUpgrade" class="view-page">
        <div class="upgrade-container">
            <div class="upgrade-slots">
                <div class="upg-slot" id="slotMy">
                    <span style="font-size:10px; color:#aaa;">Мой предмет</span>
                    <b style="font-size:11px; color:#ffb800; margin-top:4px;">Выберите снизу</b>
                </div>
                <div class="upg-slot" id="slotTarget">
                    <span style="font-size:10px; color:#aaa;">Цель</span>
                    <b style="font-size:11px; color:#ffb800; margin-top:4px;">Выберите предмет</b>
                </div>
            </div>

            <!-- Колесо Шанса Case-Battle -->
            <div class="circle-wrapper">
                <svg class="circle-svg" viewBox="0 0 160 160">
                    <circle class="circle-bg" cx="80" cy="80" r="70" />
                    <circle class="circle-sector" id="upgradeSector" cx="80" cy="80" r="70" />
                </svg>
                <div class="circle-arrow" id="upgradeArrow"></div>
                <div class="chance-text" id="chanceVal">0%</div>
            </div>

            <button class="action-btn" id="btnDoUpgrade" disabled onclick="runUpgrade()">УЛУЧШИТЬ</button>

            <div style="width:100%; margin-top:12px;">
                <div style="font-size:11px; color:#aaa; margin-bottom:4px;">Выбери предмет для получения:</div>
                <div class="target-items-grid" id="targetGrid"></div>
            </div>
        </div>
    </div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    let balance = 1000;
    let selectedRoom = null;
    let inventory = [];

    // Предметы
    const lootList = [
        { id: 1, name: "Доширак", val: 25, weight: 45, rarity: "rarity-common" },
        { id: 2, name: "Тазик", val: 60, weight: 28, rarity: "rarity-common" },
        { id: 3, name: "Чайник", val: 150, weight: 14, rarity: "rarity-rare" },
        { id: 4, name: "Микроволновка", val: 350, weight: 7, rarity: "rarity-rare" },
        { id: 5, name: "Колонка JBL", val: 900, weight: 3.5, rarity: "rarity-epic" },
        { id: 6, name: "Геймпад", val: 2000, weight: 1.5, rarity: "rarity-epic" },
        { id: 7, name: "Ноутбук", val: 4500, weight: 0.8, rarity: "rarity-legendary" },
        { id: 8, name: "Ключ от Рефки", val: 12000, weight: 0.2, rarity: "rarity-legendary" }
    ];

    let myUpgItem = null;
    let targetUpgItem = null;

    // Переключение табов
    function switchTab(tab) {
        document.getElementById('tabRoulette').classList.toggle('active', tab === 'roulette');
        document.getElementById('tabUpgrade').classList.toggle('active', tab === 'upgrade');
        document.getElementById('pageRoulette').classList.toggle('active', tab === 'roulette');
        document.getElementById('pageUpgrade').classList.toggle('active', tab === 'upgrade');
        if (tab === 'upgrade') renderTargetItems();
    }

    // Отрисовка комнат
    const roomsGrid = document.getElementById('roomsGrid');
    for (let i = 1; i <= 80; i++) {
        let price = Math.floor(i * 12 + 25);
        let card = document.createElement('div');
        card.className = 'room-card';
        card.onclick = () => {
            document.querySelectorAll('.room-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            selectedRoom = { num: i, price };
            document.getElementById('selectedRoomTitle').innerText = `Комната №${i} (Ставка: ${price} 🪙)`;
            document.getElementById('battleArea').style.display = 'block';
        };
        card.innerHTML = `<div style="font-size:9px; color:#66fcf1;">№${i}</div><div style="font-size:10px; color:#ffb800; font-weight:bold;">${price} 🪙</div>`;
        roomsGrid.appendChild(card);
    }

    function updateInventoryUI() {
        const list = document.getElementById('inventoryList');
        document.getElementById('invCount').innerText = `${inventory.length} шт.`;
        list.innerHTML = '';

        if (inventory.length === 0) {
            list.innerHTML = `<div style="font-size:11px; color:#5A5D73; padding:15px; text-align:center; width:100%;">Инвентарь пуст.</div>`;
            return;
        }

        inventory.forEach((item, index) => {
            let div = document.createElement('div');
            let isSelected = myUpgItem && myUpgItem.invIndex === index;
            div.className = `inv-card ${item.rarity} ${isSelected ? 'selected' : ''}`;
            div.onclick = () => selectMyItemForUpgrade(index);
            div.innerHTML = `
                <div class="inv-card-name">${item.name}</div>
                <div class="inv-card-val">${item.val} 🪙</div>
            `;
            list.appendChild(div);
        });
    }

    function deposit() {
        balance += 500;
        document.getElementById('balance').innerText = balance;
    }

    // РУЛЕТКА
    function getRandomLoot() {
        let rand = Math.random() * 100, cum = 0;
        for (let item of lootList) {
            cum += item.weight;
            if (rand <= cum) return item;
        }
        return lootList[0];
    }

    function startBattle() {
        if (!selectedRoom || balance < selectedRoom.price) { alert("Мало монет!"); return; }
        balance -= selectedRoom.price;
        document.getElementById('balance').innerText = balance;
        document.getElementById('spinBtn').disabled = true;

        const track = document.getElementById('track');
        track.style.transition = 'none';
        track.style.transform = 'translateX(0px)';
        track.innerHTML = '';

        let items = [];
        for (let i = 0; i < 200; i++) {
            let drop = getRandomLoot();
            items.push(drop);
            let d = document.createElement('div');
            d.className = `drop-item ${drop.rarity}`;
            d.innerHTML = `<div class="drop-item-title">${drop.name}</div><div class="drop-item-val">${drop.val} 🪙</div>`;
            track.appendChild(d);
        }

        setTimeout(() => {
            track.style.transition = 'transform 4.5s cubic-bezier(0.08, 0.82, 0.17, 1)';
            let winIdx = Math.floor(Math.random() * 20) + 140;
            let moveAmount = -(winIdx * 98 - (document.getElementById('rouletteContainer').offsetWidth / 2 - 49));
            track.style.transform = `translateX(${moveAmount}px)`;

            setTimeout(() => {
                inventory.push(items[winIdx]);
                updateInventoryUI();
                document.getElementById('spinBtn').disabled = false;
            }, 4700);
        }, 100);
    }

    // ЛОГИКА АПГРЕЙДА (CASE-BATTLE)
    function selectMyItemForUpgrade(index) {
        myUpgItem = { ...inventory[index], invIndex: index };
        document.getElementById('slotMy').className = `upg-slot filled ${myUpgItem.rarity}`;
        document.getElementById('slotMy').innerHTML = `
            <span class="inv-card-name">${myUpgItem.name}</span>
            <b class="inv-card-val">${myUpgItem.val} 🪙</b>
        `;
        updateInventoryUI();
        calcUpgradeChance();
    }

    function renderTargetItems() {
        const grid = document.getElementById('targetGrid');
        grid.innerHTML = '';
        lootList.forEach(item => {
            let d = document.createElement('div');
            d.className = `room-card ${item.rarity}`;
            d.onclick = () => {
                targetUpgItem = item;
                document.getElementById('slotTarget').className = `upg-slot filled ${item.rarity}`;
                document.getElementById('slotTarget').innerHTML = `
                    <span class="inv-card-name">${item.name}</span>
                    <b class="inv-card-val">${item.val} 🪙</b>
                `;
                calcUpgradeChance();
            };
            d.innerHTML = `<div class="drop-item-title">${item.name}</div><div class="drop-item-val">${item.val} 🪙</div>`;
            grid.appendChild(d);
        });
    }

    function calcUpgradeChance() {
        if (!myUpgItem || !targetUpgItem) return;
        
        // Расчёт шанса по стоимости (как на Case-Battle)
        let chance = (myUpgItem.val / targetUpgItem.val) * 100;
        if (chance > 80) chance = 80; // Максимальный шанс 80%

        document.getElementById('chanceVal').innerText = chance.toFixed(1) + '%';

        // Длина окружности 2 * pi * 70 = 439.8
        let sectorLength = (chance / 100) * 440;
        document.getElementById('upgradeSector').style.strokeDasharray = `${sectorLength} 440`;

        document.getElementById('btnDoUpgrade').disabled = (chance <= 0);
    }

    function runUpgrade() {
        if (!myUpgItem || !targetUpgItem) return;

        let btn = document.getElementById('btnDoUpgrade');
        btn.disabled = true;

        let chance = (myUpgItem.val / targetUpgItem.val) * 100;
        if (chance > 80) chance = 80;

        // Поворот стрелки
        let randomDeg = Math.floor(Math.random() * 360) + 1440; // Минимум 4 оборота
        let arrow = document.getElementById('upgradeArrow');
        arrow.style.transition = 'transform 4s cubic-bezier(0.15, 0.9, 0.2, 1)';
        arrow.style.transform = `translateX(-50%) rotate(${randomDeg}deg)`;

        setTimeout(() => {
            let finalAngle = randomDeg % 360;
            let winAngle = (chance / 100) * 360;

            // Стираем потраченный предмет из инвентаря
            inventory.splice(myUpgItem.invIndex, 1);

            if (finalAngle <= winAngle) {
                // Победа!
                inventory.push(targetUpgItem);
                alert(`🎉 УСПЕХ! Вы получили ${targetUpgItem.name}!`);
            } else {
                // Неудача
                alert(`💥 НЕУДАЧА! Предмет сгорел.`);
            }

            // Сброс
            myUpgItem = null;
            targetUpgItem = null;
            document.getElementById('slotMy').innerHTML = '<span style="font-size:10px; color:#aaa;">Мой предмет</span>';
            document.getElementById('slotTarget').innerHTML = '<span style="font-size:10px; color:#aaa;">Цель</span>';
            document.getElementById('chanceVal').innerText = '0%';
            document.getElementById('upgradeSector').style.strokeDasharray = `0 440`;
            arrow.style.transition = 'none';
            arrow.style.transform = `translateX(-50%) rotate(0deg)`;

            updateInventoryUI();
        }, 4200);
    }
</script>
</body>
</html>
